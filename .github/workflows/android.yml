name: Build My Progress APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MyProgressAndroid.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir appsrc
          unzip MyProgressAndroid.zip -d appsrc

      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          p = 'appsrc/app/build.gradle.kts'
          s = open(p).read()
          s = s.replace('android {', '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }''', 1)
          open(p, 'w').write(s)
          PY

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: -p appsrc assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MyProgress-APK
          path: appsrc/app/build/outputs/apk/debug/*.apk
